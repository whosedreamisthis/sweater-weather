<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SweaterWeather · Forecasts and what to wear</title>
    <meta
      name="description"
      content="Current conditions, hourly and daily forecasts for any city, plus a simple answer to what to wear today."
    />
    <meta name="theme-color" content="#2f6fed" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SweaterWeather" />
    <meta property="og:title" content="SweaterWeather · Forecasts and what to wear" />
    <meta
      property="og:description"
      content="Current conditions, hourly and daily forecasts for any city, plus a simple answer to what to wear today."
    />
    <meta name="twitter:card" content="summary" />
    <script>
      // Set the theme before first paint to avoid a flash. Keep in sync with src/utils/theme.ts.
      (function () {
        var theme = 'system';
        try {
          var saved = JSON.parse(localStorage.getItem('sweater-weather') || '{}');
          var value = saved && saved.state && saved.state.theme;
          if (value === 'light' || value === 'dark' || value === 'system') theme = value;
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' &&
            typeof matchMedia === 'function' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        var resolved = dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>SweaterWeather needs JavaScript to show live weather.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
